services:
  postgres:
    image: postgres:16-alpine
    container_name: taskdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskdesk
      POSTGRES_USER: taskdesk
      POSTGRES_PASSWORD: taskdesk_local
    ports:
      - "5432:5432"
    volumes:
      - taskdesk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskdesk -d taskdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taskdesk_postgres_data:
