name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://taskdesk:taskdesk_local@localhost:5432/taskdesk?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build applications
        run: npm run build
