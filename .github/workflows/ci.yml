name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskdesk
          POSTGRES_USER: taskdesk
          POSTGRES_PASSWORD: taskdesk_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskdesk -d taskdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://taskdesk:taskdesk_local@localhost:5432/taskdesk?schema=public
      DATABASE_URL: postgresql://taskdesk:taskdesk_local@localhost:5432/taskdesk?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Audit high and critical runtime advisories
        run: npm run audit:prod
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Apply database migrations
        run: npm run db:deploy --workspace @taskdesk/api
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build applications
        run: npm run build
